<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookulator — Cookie Central</title>
<style>
:root{--grape:#4A2E6B;--grape-dk:#2D2235;--lilac:#B79BD6;--ink:#2B2B33;--muted:#7A7487;--line:#E7E2EE;--bg:#FAF8FC;
--raw:#B5651D;--wip:#C9943B;--cookie:#7A5BA0;--each:#3A6EA5;--inner:#2E7D6B;--master:#1E5F8A;--pallet:#5B7A3A;}
*{box-sizing:border-box}body{margin:0;font-family:'Outfit',-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
.top{background:var(--grape-dk);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:14px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
.top .tag{font-size:12px;color:var(--lilac);font-weight:500}
.lockbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:16px;width:38px;height:38px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lockbtn:hover{background:rgba(255,255,255,.22)}
.lockbtn.unlocked{background:#C2185B;border-color:#C2185B}
.waffle{position:relative;margin-left:auto}
.waffle-btn{width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.waffle-btn:hover{background:rgba(255,255,255,.22)}
.waffle-btn svg{width:18px;height:18px}
.waffle-menu{position:absolute;top:46px;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(45,34,53,.25);padding:14px;width:280px;z-index:200}
.waffle-menu .wm-head{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:2px 4px 10px}
.wm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 10px;border-radius:11px;border:1px solid var(--line);text-decoration:none;cursor:pointer;background:#fff;transition:.12s;text-align:center}
.wm-app:hover{border-color:#C2185B;background:#FDF0F6}
.wm-app.current{border-color:var(--grape);background:#F6F3FA;cursor:default}
.wm-app .wm-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px}
.wm-app .wm-name{font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.25}
.wm-app .wm-tag{font-size:10px;font-weight:700;color:var(--muted)}
.wm-app.current .wm-tag{color:var(--grape)}
.wm-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:12px;padding:9px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.wm-bg{position:fixed;inset:0;z-index:150}
.samptoggle{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
.samptoggle:hover{border-color:#C2185B;color:#C2185B}
.samptoggle.on{background:#C2185B;color:#fff;border-color:#C2185B}
.chainbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.chainbar .step{display:flex;align-items:center;gap:6px}
.chainbar .node{padding:3px 10px;border-radius:13px;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.2px;cursor:pointer;border:0}
.chainbar .arrow{color:var(--muted);font-size:13px}
.chainbar .factor{font-size:9.5px;color:var(--muted);font-style:italic;margin:0 2px}
.tiers{display:flex;gap:0;background:var(--grape-dk);padding:0 22px}
.tiers button{border:0;background:transparent;color:#cdbfe0;cursor:pointer;border-bottom:3px solid transparent;padding:11px 16px;font-size:13px;font-weight:600}
.tiers button.active{color:#fff;border-bottom-color:var(--lilac)}
.tiers button:hover:not(.active){color:#fff}
.wrap{padding:18px 22px}
.head{font-size:12.5px;color:var(--ink);margin-bottom:6px;line-height:1.5}
.head b{color:var(--grape)}
.rollnote{font-size:11px;color:var(--muted);margin-bottom:12px;padding:7px 11px;background:#F3EFF8;border-radius:7px;border-left:3px solid var(--lilac)}
.rollnote .up{color:var(--master);font-weight:600}.rollnote .down{color:var(--raw);font-weight:600}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(45,34,53,.07)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
th{background:#F6F2FB;color:var(--grape);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
tr:hover td{background:#FBF9FE}
.modband th{font-size:9.5px;padding:4px 10px;color:#fff;text-align:center}
.factor-col{background:#FFF8EC!important;font-weight:700;color:#9A6B1E}
.chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600;background:#EFE7F8;color:#5B3A86}
.empty{color:#C3BCD0;font-style:italic}
.tbd{background:#F0ECF5;color:#8A7AA0;font-style:italic;font-weight:600;padding:1px 7px;border-radius:5px;font-size:10.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#F2EEF8;padding:1px 5px;border-radius:4px}
.linkup{color:var(--master);font-size:11px}.linkdown{color:var(--raw);font-size:11px}
.subtitle{font-size:11px;color:var(--muted);margin:2px 0 0}
th.sortable{cursor:pointer;user-select:none;position:relative}
th.sortable:hover{background:#EFE7F8}
th .sortarrow{font-size:9px;color:var(--lilac);margin-left:3px}
th .filterbtn{cursor:pointer;margin-left:4px;font-size:10px;color:var(--muted);border:0;background:none}
th .filterbtn.active{color:var(--grape);font-weight:900}
.filterpop{position:absolute;top:100%;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(45,34,53,.18);padding:8px;min-width:150px;text-align:left;font-weight:400;text-transform:none;letter-spacing:0}
.filterpop label{display:block;font-size:11.5px;padding:3px 4px;cursor:pointer;white-space:nowrap}
.filterpop label:hover{background:#F6F2FB;border-radius:4px}
.filterpop .fpactions{display:flex;gap:6px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.filterpop .fpactions button{flex:1;font-size:10.5px;padding:3px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.oz1{background:#FBF1DF;color:#9A6B1E}.oz2{background:#F3D9A8;color:#7A4E12}.oz3{background:#E8B96B;color:#5C3A0A}
.prep-baked{background:#F5E6D3;color:#9A5B1E}.prep-raw{background:#D6E4F0;color:#1E5F8A}
.flav-chip{background:#EDE7F5;color:#5B3A86}
/* provenance row (under column titles, toggleable) */
tr.provrow th{font-size:8.5px;padding:2px 8px;text-align:left;font-weight:700;letter-spacing:.2px;text-transform:none;position:static}
/* edit/add buttons */
.tabactions{display:flex;gap:8px;margin-bottom:12px}
.tabactions button{padding:7px 16px;border-radius:7px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:12px}
.btn-add{background:var(--grape);color:#fff;border-color:var(--grape)}
.btn-add:hover{background:#3a2356}
.btn-edit{background:#fff;color:var(--grape)}
.btn-edit:hover{background:#F6F2FB}
.btn-edit.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(45,34,53,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.modal{background:#fff;border-radius:13px;box-shadow:0 12px 40px rgba(45,34,53,.3);width:480px;max-width:92vw;max-height:80vh;overflow:auto}
.modal h3{margin:0;padding:15px 20px;border-bottom:1px solid var(--line);font-size:15px;color:var(--grape)}
.modal .body{padding:16px 20px}
.modal .fld{margin-bottom:13px}
.modal label{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.modal label .req{color:#C0392B}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit}
.modal select{cursor:pointer;background:#fff}
.modal .hint{font-size:10.5px;color:var(--muted);margin-top:3px;font-style:italic}
.modal .pulled-note{font-size:10.5px;color:var(--wip);margin-top:3px;font-weight:600}
.modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.modal .foot button{padding:8px 18px;border-radius:7px;border:0;cursor:pointer;font-weight:700;font-size:12.5px}
.modal .save{background:var(--grape);color:#fff}.modal .cancel{background:#EEE;color:#555}
.modal .err{color:#C0392B;font-size:11.5px;margin-top:8px;font-weight:600}
.editcell{outline:2px dashed var(--lilac);outline-offset:-2px;cursor:text}
/* column chooser */
.colchooser{position:relative;display:inline-block}
.colchooser>button{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--grape);cursor:pointer;font-weight:700;font-size:12px}
.colchooser>button:hover{background:#F6F2FB}
.colpanel{position:absolute;top:100%;left:0;margin-top:4px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgba(45,34,53,.18);padding:10px;min-width:210px}
.colpanel .grp{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:8px 2px 4px}
.colpanel .grp:first-child{margin-top:0}
.colpanel label{display:block;font-size:12px;padding:4px 4px;cursor:pointer;border-radius:5px}
.colpanel label:hover{background:#F6F2FB}
.colpanel label.locked{color:var(--muted);cursor:default}
.colpanel label.locked:hover{background:none}
.brand-walmart{background:#E3EEF5;color:#1A5276}
.brand-dirty{background:#F8E3EE;color:#A01C5B}
.editor-badge{font-size:10px;font-weight:700;color:#1E6E45;background:#E6F4EC;padding:4px 10px;border-radius:11px;align-self:center;margin-left:auto}
.editmode-toggle{padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--grape);cursor:pointer;font-weight:700;font-size:12px}
.editmode-toggle:hover{background:#F6F2FB}
.editmode-toggle.on{background:var(--grape);color:#fff;border-color:var(--grape)}
.editmode-indicator{font-size:10.5px;font-weight:700;color:#9A5B1E;background:#FBF1DF;padding:5px 11px;border-radius:11px;align-self:center}
.viewer-badge{font-size:11px;font-style:italic;color:var(--muted)}
/* maintenance legend */
.maint{background:#FFFDF7;border:1px solid #EAD9B0;border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:11.5px;line-height:1.65}
.maint b{color:var(--grape)}
.maint .row{display:flex;gap:8px;align-items:flex-start;margin:3px 0}
.maint .lab{font-weight:700;min-width:118px;color:#9A6B1E}
.maint .addhere{color:#1E6E45;font-weight:700}
.maint .upstream{color:var(--wip);font-weight:700}
</style></head><body>

// ---- INDEXES ----
let WIP_BY_NAME={}, COOKIE_BY_CODE={}, EACH_BY_SKU={}, MC_BY_ID={}, SB_BY_ID={};
function reindex(){
 WIP_BY_NAME={};WIP.forEach(w=>WIP_BY_NAME[w.name]=w);
 COOKIE_BY_CODE={};COOKIES.forEach(c=>COOKIE_BY_CODE[c.cookie_code]=c);
 EACH_BY_SKU={};EACHES.forEach(e=>EACH_BY_SKU[e.each_sku]=e);
 MC_BY_ID={};MASTERCASES.forEach(m=>MC_BY_ID[m.case_id]=m);
 SB_BY_ID={};SHIPPINGBOXES.forEach(b=>SB_BY_ID[b.box_id]=b);
}
reindex();

// ---- CHAIN RESOLVERS (inheritance + roll-up) ----
function wipOfCookie(c){return c&&c.wip_dough?WIP_BY_NAME[c.wip_dough]:null}
function cookieOfEach(e){return e&&e.cookie_code?COOKIE_BY_CODE[e.cookie_code]:null}
function eachOfProduct(p){return p&&p.each_sku_ref?EACH_BY_SKU[p.each_sku_ref]:null}
function cookieOfProduct(p){const e=eachOfProduct(p);if(e){const c=cookieOfEach(e);if(c)return c;}
 // fallback by flavor
 if(p&&p.flavor){for(const c of COOKIES){if((c.flavor||'').toLowerCase()===(p.flavor||'').toLowerCase())return c;}}return null;}
function dispType(t){t=t||'';return(t==='Mixed'||t==='Stuffed Cookie')?'Stuffed':t}
function inhType(p){const c=cookieOfProduct(p);const w=wipOfCookie(c);return w?dispType(w.type):''}
function inhSubtype(p){const c=cookieOfProduct(p);const w=wipOfCookie(c);return w?w.subtype:''}
function cookieType(c){const w=wipOfCookie(c);return w?dispType(w.type):''}
function cookieTier(c){const w=wipOfCookie(c);return w?w.subtype:''}

// ---- ROLL-DOWN: dough oz per master case ----

function chip(txt,bg,fg){return '<span class="chip" style="background:'+bg+';color:'+fg+'">'+esc(txt)+'</span>'}
function pill(txt){return txt?'<span class="pill">'+esc(txt)+'</span>':'<span class="empty">—</span>'}
function tbd(t){return '<span class="tbd">'+(t||'TBD')+'</span>'}

function cellVal(row,key,kind){
 if(key==='_inhtype')return inhType(row)?'<span class="pill">'+esc(inhType(row))+'</span>':'<span class="empty">—</span>';
 if(key==='_inhsub')return inhSubtype(row)?'<span class="pill">'+esc(inhSubtype(row))+'</span>':'<span class="empty">—</span>';
 let v=row[key];
 switch(kind){
  case 'code':return v?'<span class="code">'+esc(v)+'</span>':'<span class="empty">—</span>';
  case 'factor':return (v===''||v==null)?'<span class="empty">—</span>':'<span class="num" style="font-weight:700;color:#9A6B1E">'+esc(v)+'</span>';
  case 'tbdfactor':return (v===''||v==null)?tbd():'<span class="num" style="font-weight:700;color:#9A6B1E">'+esc(v)+'</span>';

  case 'linkdown':return v?'<span class="linkdown">↓ '+esc(v)+'</span>':'<span class="empty">—</span>';
  case 'linkup':return v?'<span class="linkup">↑ '+esc(v)+'</span>':'<span class="empty">—</span>';
  case 'list':return (v&&v.length)?esc(v.join(', ')):'<span class="empty">—</span>';
  case 'upc':return v?'<span class="code">'+esc(v)+'</span>':'<span class="empty">no UPC</span>';
  case 'gtin':return v?'<span class="code">'+esc(v)+'</span>':'<span class="empty">—</span>';
  case 'dims':return v?'<span class="code">'+esc(v)+'</span>':tbd('set dims');
  case 'compose':return '<span class="chip" style="background:#E3EEF5;color:#1E5F8A">'+esc(v||'eaches')+'</span>';
  case 'tbdcost':return (v===''||v==null)?tbd():'<span class="num" style="font-weight:700;color:#1E6E45">$'+esc(v)+'</span>';
  case 'usedby':return '<span class="empty">—</span>';

  case 'editprod':return '<button class="btn-edit" style="padding:3px 10px;font-size:10.5px" onclick="openEdit(\'proddough\',\''+esc(row.wip_sku)+'\')">Edit</button>';

  default:return v?esc(v):'<span class="empty">—</span>';
 }
}

let tableState={};  // per-table: {sortCol, sortDir, filters:{col:Set}}
function getTS(id){if(!tableState[id])tableState[id]={sortCol:null,sortDir:1,filters:{},openFilter:null};return tableState[id];}
function cookieVal(r,key){ // resolve value incl inherited
 if(key==='_inhtype')return cookieType(r);
 if(key==='_inhsub')return cookieTier(r);
 if(key==='_edit')return '';
 if(key==='_sample')return r.sample_eligible?'On sample site':'Not on sample site';
 if(key==='_units')return parseFloat(r.unit_qty)||0;
 if(key==='_cdesc'){const c=cookieOfCase(r);return c?c.cookie_desc:'';}
 if(key==='_cflavor'){const c=cookieOfCase(r);return c?(c.flavor||''):'';}
 if(key==='_ctier'){const c=cookieOfCase(r);return c?cookieTier(c):'';}
 if(key==='_cform'){const c=cookieOfCase(r);return c?cookieType(c):'';}
 if(key==='_coz'){const c=cookieOfCase(r);return c?parseFloat(c.dough_oz_per_cookie)||0:0;}
 if(key==='_cprep'){const c=cookieOfCase(r);return c?c.prep:'';}
 if(key==='_callerg'){const c=cookieOfCase(r);return c?(c.allergens||''):'';}
 if(key==='_epack'){const e=eachOfCase(r);return e?(e.pack_type||''):'';}
 if(key==='_ebrand'){const e=eachOfCase(r);return e?(e.brand||''):'';}
 if(key==='_plstorage')return caseStorage(r);
 if(key==='_price')return 0;
 if(key==='_storage')return cookieStorage(r);
 if(key==='_mcstorage')return caseStorage(r);
 if(key==='_ckdesc')return cookieDescOfEach(r);
 if(key==='_outer')return cookieOuterOfEach(r);
 if(key==='_stuff')return cookieStuffOfEach(r);
 if(key==='_form')return cookieFormOfEach(r);
 if(key==='_tier')return cookieTierOfEach(r);
 if(key==='_oz')return cookieOzOfEach(r);
 if(key==='_prep')return cookiePrepOfEach(r);
 if(key==='_prepstate')return cookiePrepOfEach(r);
 if(key==='_netderived'){const oz=caseNetOz(r);return oz==null?'':ozToLb(oz);}
 if(key==='_dims')return [r.length_in,r.width_in,r.height_in].filter(Boolean).join('x');
 if(key==='_contents')return r.unit_ref||'';
 if(key==='_brand')return caseBrand(r);
 if(key==='_lwh')return [r.length_in,r.width_in,r.height_in].filter(Boolean).join('x');
 return r[key];
}

function ozPill(v){if(v===''||v==null)return '<span class="empty">—</span>';const n=parseFloat(v);const cls=n<=1?'oz1':n<=2?'oz2':'oz3';return '<span class="chip '+cls+'">'+esc(v)+'oz</span>';}

// cols: [key,label,render(v,row), filterable(bool), sortable(bool)]
function interactiveTable(id,rows,cols,bandLabel,bandColor){
 const ts=getTS(id);
 // apply filters
 let view=rows.filter(r=>{
  for(const k in ts.filters){const set=ts.filters[k];if(set&&set.size){const v=String(cookieVal(r,k)==null?'':cookieVal(r,k));if(!set.has(v))return false;}}
  return true;
 });
 // sort
 if(ts.sortCol!=null){const k=ts.sortCol;view=view.slice().sort((a,b)=>{
   let av=cookieVal(a,k),bv=cookieVal(b,k);
   const an=parseFloat(av),bn=parseFloat(bv);
   if(!isNaN(an)&&!isNaN(bn))return (an-bn)*ts.sortDir;
   return String(av==null?'':av).localeCompare(String(bv==null?'':bv))*ts.sortDir;
 });}
 let h='<table><thead>';
 if(bandLabel)h+='<tr class="modband"><th colspan="'+cols.length+'" style="background:'+bandColor+'">'+bandLabel+'</th></tr>';
 const hasSrc=cols.some(c=>c[5]);
 h+='<tr>';
 cols.forEach(c=>{
  const key=c[0],label=c[1],filterable=c[3],sortable=c[4]!==false;const src=c[5];
  const isSorted=ts.sortCol===key;
  const fActive=ts.filters[key]&&ts.filters[key].size;
  h+='<th class="'+(sortable?'sortable':'')+'"'+(sortable?' onclick="tblSort(\''+id+'\',\''+key+'\')"':'')+'>'+esc(label);
  if(sortable&&isSorted)h+='<span class="sortarrow">'+(ts.sortDir>0?'▲':'▼')+'</span>';
  if(filterable){h+='<button class="filterbtn'+(fActive?' active':'')+'" onclick="event.stopPropagation();tblToggleFilter(\''+id+'\',\''+key+'\')">⏷</button>';
   if(ts.openFilter===key){
    const vals=[...new Set(rows.map(r=>String(cookieVal(r,key)==null?'':cookieVal(r,key))))].sort();
    const sel=ts.filters[key]||new Set();
    h+='<div class="filterpop" onclick="event.stopPropagation()">';
    const valsJson=encodeURIComponent(JSON.stringify(vals));
    vals.forEach(v=>{h+='<label><input type="checkbox" '+(sel.size===0||sel.has(v)?'checked':'')+' onchange="tblFilterToggle2(\''+id+'\',\''+key+'\',\''+encodeURIComponent(v)+'\',\''+valsJson+'\')"> '+(v||'(blank)')+'</label>';});
    h+='<div class="fpactions"><button onclick="tblFilterClear(\''+id+'\',\''+key+'\')">All</button><button onclick="tblFilterClose(\''+id+'\')">Done</button></div></div>';
   }
  }
  h+='</th>';
 });
 h+='</tr>';
 // provenance row UNDER the titles (toggleable)
 if(hasSrc&&showSource){
  h+='<tr class="provrow">';
  cols.forEach(c=>{
   const src=c[5];
   if(src){
    const isHere=src.tab==='here';
    const lbl=isHere?'':esc(src.label); // current-tab: color only, no label
    h+='<th style="background:'+(src.color||'#9A8BAC')+'22;color:'+(src.color||'#9A8BAC')+';border-top:2px solid '+(src.color||'#9A8BAC')+'">'+lbl+'</th>';
   } else h+='<th></th>';
  });
  h+='</tr>';
 }
 h+='</thead><tbody>';
 view.forEach(r=>{h+='<tr>'+cols.map(c=>'<td>'+c[2](cookieVal(r,c[0]),r)+'</td>').join('')+'</tr>';});
 h+='</tbody></table>';
 if(!view.length)h+='<p style="color:var(--muted);font-style:italic;margin-top:8px">No rows match the current filters.</p>';
 return h;
}
function tblSort(id,key){const ts=getTS(id);if(ts.sortCol===key)ts.sortDir*=-1;else{ts.sortCol=key;ts.sortDir=1;}render();}
function tblToggleFilter(id,key){const ts=getTS(id);ts.openFilter=ts.openFilter===key?null:key;render();}
function tblFilterClose(id){getTS(id).openFilter=null;render();}
function tblFilterToggle(id,key,val,allVals){const ts=getTS(id);if(!ts.filters[key]){ts.filters[key]=new Set(allVals);}const s=ts.filters[key];
 if(s.has(val))s.delete(val);else s.add(val);
 if(s.size===allVals.length){delete ts.filters[key];} // all checked = no filter
 render();}
function tblFilterToggle2(id,key,encVal,encVals){tblFilterToggle(id,key,decodeURIComponent(encVal),JSON.parse(decodeURIComponent(encVals)));}
function tblFilterClear(id,key){const ts=getTS(id);delete ts.filters[key];render();}

function tableForColor(rows,cols,bandLabel,color){

 h+='<tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>';
 rows.forEach(r=>{h+='<tr>'+cols.map(c=>'<td>'+cellVal(r,c[0],c[2])+'</td>').join('')+'</tr>';});
 h+='</tbody></table>';return h;
}

// Unified edit-mode actions bar. Read-only by default.
// Permission gate -> mode toggle -> actions. When editMode OFF: read-only (toggle only, if permitted).
// When ON: Add button(s) appear + active indicator. addSpecs: [{formKey,label}]
function maint(html){return (canEdit&&editMode)?html:'';}
function actionsBar(addSpecs){
 if(!canEdit)return '';
 if(!editMode)return '';   // view-only: no actions (controlled by top-right lock)
 if(typeof addSpecs==='string')addSpecs=[{formKey:addSpecs,label:'+ Add '+FORMS[addSpecs].title}];
 let h='<div class="tabactions">';
 addSpecs.forEach(a=>{h+='<button class="btn-add" onclick="openAdd(\''+a.formKey+'\')">'+esc(a.label)+'</button>';});
 h+='<span class="editmode-indicator">Editing enabled — changes are live</span>';
 h+='</div>';
 return h;
}
function openAdd(formKey){modalState={formKey,mode:'add',data:{},err:''};renderModal();}
function openEdit(formKey,idVal){const F=FORMS[formKey];const row=F.arr().find(r=>r[F.idKey]===idVal);if(!row)return;modalState={formKey,mode:'edit',data:Object.assign({},row),origId:idVal,err:''};renderModal();}
function closeModal(){modalState=null;const m=document.getElementById('modalmount');if(m)m.innerHTML='';}
function modalField(f,val){
 let h='<div class="fld"><label>'+esc(f.label)+(f.req?' <span class="req">*</span>':'')+'</label>';
 if(f.type==='select'){
   const opts=f.opts();
   if(opts.filter(o=>o.v!=='').length===0&&f.emptyNote){
     h+='<select disabled><option>— unavailable —</option></select>';
     h+='<div class="pulled-note" style="color:#C0392B">⚠ '+f.emptyNote+'</div>';
   }else{
     h+='<select onchange="modalSet(\''+f.key+'\',this.value)">';
     opts.forEach(o=>{h+='<option value="'+esc(o.v)+'"'+(String(val||'')===String(o.v)?' selected':'')+'>'+esc(o.label)+'</option>';});
     h+='</select>';
     if(f.pulledNote)h+='<div class="pulled-note">↑ '+f.pulledNote+'</div>';
   }
 }else{
   h+='<input type="'+(f.type==='num'?'number':'text')+'" value="'+esc(val==null?'':val)+'" oninput="modalSet(\''+f.key+'\',this.value)">';
   if(f.hint)h+='<div class="hint">'+esc(f.hint)+'</div>';
 }
 h+='</div>';return h;
}
function modalSet(key,val){if(modalState)modalState.data[key]=val;}
function renderModal(){
 const mount=document.getElementById('modalmount');if(!mount)return;
 if(!modalState){mount.innerHTML='';return;}
 const F=FORMS[modalState.formKey];
 let h='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>'+(modalState.mode==='add'?'Add ':'Edit ')+esc(F.title)+'</h3><div class="body">';
 F.fields.forEach(f=>{h+=modalField(f,modalState.data[f.key]);});
 if(modalState.err)h+='<div class="err">'+esc(modalState.err)+'</div>';
 h+='</div><div class="foot"><button class="cancel" onclick="closeModal()">Cancel</button><button class="save" onclick="modalSave()">'+(modalState.mode==='add'?'Add':'Save')+'</button></div></div></div>';
 mount.innerHTML=h;
}
function modalSave(){
 const F=FORMS[modalState.formKey];const d=modalState.data;
 for(const f of F.fields){if(f.req&&(d[f.key]==null||String(d[f.key]).trim()===''))
   {modalState.err='“'+f.label+'” is required.';renderModal();return;}}
 const arr=F.arr();
 if(modalState.mode==='add'){
   if(arr.some(r=>r[F.idKey]===d[F.idKey])){modalState.err=F.title+' “'+d[F.idKey]+'” already exists.';renderModal();return;}
   const row={};F.fields.forEach(f=>row[f.key]=d[f.key]!=null?d[f.key]:'');arr.push(row);
 }else{
   const row=arr.find(r=>r[F.idKey]===modalState.origId);if(row)F.fields.forEach(f=>row[f.key]=d[f.key]!=null?d[f.key]:'');
 }
 reindex();closeModal();render();
}


// ===== EACHES: resolvers, brand pill, column chooser =====
function cookieDescOfEach(e){const c=cookieOfEach(e);return c?c.cookie_desc:'';}
// STORAGE derives from prep: Baked -> Ambient, Raw -> Frozen
function prepToStorage(prep){if(!prep)return '';return prep.toLowerCase()==='raw'?'Frozen':'Ambient';}
function cookieStorage(c){return c?prepToStorage(c.prep):'';}
function caseStorage(mc){
 if(mc.storage_override)return mc.storage_override; // manual override
 if(mc.composed_of==='cookies'){const c=COOKIE_BY_CODE[mc.unit_ref];return c?prepToStorage(c.prep):'';}
 if(mc.composed_of==='eaches'){const e=EACH_BY_SKU[mc.unit_ref];const c=e?cookieOfEach(e):null;return c?prepToStorage(c.prep):'';}
 return '';
}
function sampleTogglePill(item,arrName,idKey){
 const on=!!item.sample_eligible;
 if(editMode){
   return '<button class="samptoggle'+(on?' on':'')+'" onclick="toggleSample(\''+arrName+'\',\''+esc(item[idKey])+'\')">'+(on?'✓ On sample site':'Add to samples')+'</button>';
 }
 return on?'<span class="chip" style="background:#FDF0F6;color:#C2185B">✓ Sample</span>':'<span class="empty">—</span>';
}
function toggleSample(arrName,id){
 const map={cookies:[COOKIES,'cookie_code'],eaches:[EACHES,'each_sku'],inner:[INNER,'inner_sku'],mastercases:[MASTERCASES,'case_id']};
 const [arr,key]=map[arrName]||[];if(!arr)return;
 const it=arr.find(x=>String(x[key])===String(id));if(it){it.sample_eligible=!it.sample_eligible;render();}
}
function storagePill(v){if(!v)return '<span class="empty">—</span>';const frozen=v==='Frozen';return '<span class="chip" style="background:'+(frozen?'#DCEBF5':'#F3ECDD')+';color:'+(frozen?'#1A6091':'#8A6410')+'">'+(frozen?'❄ ':'🌡 ')+esc(v)+'</span>';}
// NET WEIGHT derivation (rolls down to cookie dough oz)
function eachNetOz(e){const c=cookieOfEach(e);if(!c)return null;const oz=parseFloat(c.dough_oz_per_cookie),n=parseFloat(e.cookies_per_each);if(isNaN(oz)||isNaN(n))return null;return oz*n;}
function caseBrand(mc){if(mc.composed_of==='eaches'){const e=EACH_BY_SKU[mc.unit_ref];return e?e.brand:'';}if(mc.composed_of==='cookies')return 'Dirty Cookie';return '';}
function caseNetOz(mc){
 const q=parseFloat(mc.unit_qty);if(isNaN(q))return null;
 if(mc.composed_of==='eaches'){const e=EACH_BY_SKU[mc.unit_ref];const en=e?eachNetOz(e):null;return en==null?null:en*q;}
 if(mc.composed_of==='cookies'){const c=COOKIE_BY_CODE[mc.unit_ref];const oz=c?parseFloat(c.dough_oz_per_cookie):NaN;return isNaN(oz)?null:oz*q;}
 return null;
}
function ozToLb(oz){return oz==null?null:(oz/16);}
function cookieFormOfEach(e){const c=cookieOfEach(e);return c?cookieType(c):'';}
function cookieTierOfEach(e){const c=cookieOfEach(e);return c?cookieTier(c):'';}
function cookieOuterOfEach(e){const c=cookieOfEach(e);return c?c.outer_cookie:'';}
function cookieStuffOfEach(e){const c=cookieOfEach(e);return c?c.stuffing:'';}
function cookieOzOfEach(e){const c=cookieOfEach(e);return c?c.dough_oz_per_cookie:'';}
function cookiePrepOfEach(e){const c=cookieOfEach(e);return c?c.prep:'';}
function brandPill(v){if(!v)return '<span class="empty">—</span>';const cls=v==='Walmart'?'brand-walmart':'brand-dirty';const lbl=v==='Walmart'?'Walmart · bettergoods':v;return '<span class="chip '+cls+'">'+esc(lbl)+'</span>';}
// optional rolled-up columns the chooser can toggle (key -> default shown)
let eachCols={cookie_desc:true,brand:true,outer:false,stuffing:false,form:false,tier:false,oz:false,prep:false,component:true};
let mcCols={brand:true,storage:true,madeof:false,dims:true,gross:true,net:true,status:false,ti:true,hi:true,cpp:true,cube:false,netsheet:false,palletsize:false,palletwt:false,loadht:false,shelf:false,country:false};
function toggleMcCol(k){mcCols[k]=!mcCols[k];render();}
let innerCols={sellable:true,gtin:true};
function toggleInnerCol(k){innerCols[k]=!innerCols[k];render();}
let colPanelOpen=false;
function toggleColPanel(){colPanelOpen=!colPanelOpen;render();}
function toggleEachCol(k){eachCols[k]=!eachCols[k];render();}

let cur='wip';
let showSource=true;
let cookieCols={dough:false,allergens:false};
function toggleCookieCol(k){cookieCols[k]=!cookieCols[k];render();}
function toggleSource(){showSource=!showSource;render();}
let canEdit=true;       // PERMISSION FLAG — wire to real user role later
let editMode=false;     // Edit-mode toggle (reveals per-row Edit buttons)
function toggleEditMode(){editMode=!editMode;updateLock();render();}
function updateLock(){const b=document.getElementById('lockbtn');if(!b)return;if(editMode){b.textContent='🔓';b.classList.add('unlocked');b.title='Editing enabled — click to lock (view-only)';}else{b.textContent='🔒';b.classList.remove('unlocked');b.title='View-only — click to enable editing';}}
function buildTiers(){
 const el=document.getElementById('tiers');el.innerHTML='';
 Object.entries(TABS).forEach(([k,t])=>{
  const b=document.createElement('button');b.textContent=t.name;b.className=k===cur?'active':'';
  b.onclick=()=>go(k);el.appendChild(b);
 });
}
function go(k){cur=k;render();}
function render(){
 buildTiers();
 document.getElementById('head').innerHTML=TABS[cur].head;
 document.getElementById('rollnote').innerHTML=TABS[cur].roll;
 document.getElementById('grid').innerHTML=TABS[cur].render();
}
buildChainbar();updateLock();render();
</script></body></html>
