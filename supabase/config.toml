# Cookie Central — Supabase CLI config (Edge Functions).
#
# The project is otherwise cloud-managed (ADR-014); this file exists so the
# Gmail-agent functions deploy reproducibly with the right per-function settings.
#
# Deploy:  npx supabase functions deploy <name>
#   gmail-oauth-callback is PUBLIC — hit by the browser redirect from Google with
#   no JWT, so verify_jwt = false. gmail-poll / gmail-extract are protected: a
#   signed-in admin's JWT (button) OR the cron service-role key both satisfy it.

project_id = "niesswmibmonlbrbcecj"

[functions.gmail-oauth-callback]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.gmail-poll]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.gmail-extract]
verify_jwt = true
import_map = "./functions/import_map.json"

# shipstation-customstore is PUBLIC to ShipStation — it authenticates with HTTP
# Basic Auth (Vault creds), not a Supabase JWT, so verify_jwt = false.
[functions.shipstation-customstore]
verify_jwt = false
import_map = "./functions/import_map.json"

# shipstation-deliverby is outbound-only (we call ShipStation, nobody calls us).
# Protected like gmail-poll: the cron service-role bearer satisfies it. Note the
# public anon key ALSO satisfies verify_jwt — see ADR-034 (e).
[functions.shipstation-deliverby]
verify_jwt = true
import_map = "./functions/import_map.json"
