<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Central — Dirty Cookie</title>
<style>
:root{
--aubergine:#2D2235;--aubergine-lt:#3E3049;--pink:#C2185B;--pink-lt:#E91E7B;
--cream:#FAF7F3;--paper:#FFFFFF;--ink:#2B2530;--muted:#8A8194;--line:#EAE4EE;
--mint:#2E9E7B;--amber:#C9820E;--sky:#2E7DB5;--exp:#D33A2C;
--radius:12px;--shadow:0 1px 3px rgba(45,34,53,.08),0 8px 24px rgba(45,34,53,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
/* ===== TOP NAV ===== */
.nav{background:var(--aubergine);color:#fff;padding:0 24px;display:flex;align-items:center;gap:4px;height:60px;position:sticky;top:0;z-index:50}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;margin-right:8px;display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.brand small{font-weight:500;color:#C9B8D6;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.nav .tabs{display:flex;gap:2px;margin-left:18px}
.nav .tabs button{background:transparent;border:0;color:#C9B8D6;font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:8px;cursor:pointer;font-family:inherit}
.nav .tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav .tabs button.active{color:#fff;background:var(--pink)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.waffle{position:relative}
.waffle-btn{width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.waffle-btn:hover{background:rgba(255,255,255,.18)}
.waffle-btn svg{width:18px;height:18px}
.waffle-menu{position:absolute;top:46px;right:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(45,34,53,.25);padding:14px;width:280px;z-index:60}
.waffle-menu .wm-head{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:2px 4px 10px}
.wm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wm-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 10px;border-radius:11px;border:1px solid var(--line);text-decoration:none;cursor:pointer;background:var(--paper);transition:.12s;text-align:center}
.wm-app:hover{border-color:var(--pink);background:#FDF0F6}
.wm-app.current{border-color:var(--aubergine);background:#F6F3FA;cursor:default}
.wm-app .wm-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px}
.wm-app .wm-name{font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.25}
.wm-app .wm-tag{font-size:10px;font-weight:700;color:var(--muted)}
.wm-app.current .wm-tag{color:var(--pink)}
.wm-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:12px;padding:9px 10px;background:#FBF9FC;border-radius:8px;border:1px solid var(--line)}
.wm-bg{position:fixed;inset:0;z-index:55}
.cartbtn{position:relative;background:var(--pink);border:0;color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit}
.cartbtn .badge{position:absolute;top:-7px;right:-7px;background:#fff;color:var(--pink);border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
/* ===== LAYOUT ===== */
.wrap{max-width:1200px;margin:0 auto;padding:26px 24px 60px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.pagehead h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.4px}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.btn{border:0;border-radius:9px;font-weight:700;font-size:13.5px;padding:10px 18px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--pink);color:#fff}.btn-primary:hover{background:var(--pink-lt)}
.btn-ghost{background:var(--paper);color:var(--aubergine);border:1px solid var(--line)}.btn-ghost:hover{background:#F6F2FA}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
/* ===== SHOP GRID ===== */
.shopbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.chipfilter{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chipfilter.on{background:var(--aubergine);color:#fff;border-color:var(--aubergine)}
.tier-gourmet{background:#F3E3D0;color:#9A5B1E}.tier-classic{background:#D9EAF5;color:#1E5F8A}
/* compact catalog table grouped by flavor */
.flavgroup{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.flavgroup .fg-head{display:flex;align-items:center;gap:11px;padding:13px 18px;background:linear-gradient(90deg,#FBF6F9,#fff);border-bottom:1px solid var(--line)}
.flavgroup .fg-emoji{font-size:22px}
.flavgroup .fg-name{font-weight:800;font-size:15px}
.flavgroup .fg-count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.catrow{display:grid;grid-template-columns:1.4fr .7fr .9fr 1fr auto;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow:hover{background:#FDFAFC}
.catrow .c-variant{font-weight:700;font-size:13px}
.catrow .c-code{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.col-head{display:grid;grid-template-columns:1.4fr .7fr .9fr 1fr auto;gap:12px;padding:7px 18px 5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.attr-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:11px}
.size-pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:8px;background:#F1ECF6;color:var(--aubergine)}
.prep-baked{background:#F3ECDD;color:#9A5B1E}.prep-raw{background:#DCEBF5;color:#1A6091}
.qtybox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qtybox button{background:#F6F2FA;border:0;width:28px;height:30px;font-size:15px;cursor:pointer;color:var(--aubergine);font-weight:700}
.qtybox input{width:34px;height:30px;border:0;text-align:center;font-size:13px;font-family:inherit;font-weight:700}
.addbtn{background:var(--aubergine);color:#fff;border:0;border-radius:8px;height:32px;padding:0 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.addbtn:hover{background:var(--aubergine-lt)}
.addbtn.added{background:var(--mint)}
.rowactions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
/* prep/tier hierarchy */
.prepband{margin-bottom:20px}
.prepband .pb-head{display:flex;align-items:center;gap:10px;padding:9px 4px;margin-bottom:8px}
.prepband .pb-badge{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:5px 14px;border-radius:20px}
.prepband .pb-count{font-size:11.5px;color:var(--muted);font-weight:600}
.tiersect{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.tiersect .ts-head{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line)}
.tiersect .ts-name{font-weight:800;font-size:14px}
.tiersect .ts-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.catrow2{display:grid;grid-template-columns:2.4fr .7fr .9fr 150px;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.catrow2:last-child{border-bottom:0}.catrow2:hover{background:#FDFAFC}
.col-head2{display:grid;grid-template-columns:2.4fr .7fr .9fr 150px;gap:12px;padding:7px 18px 5px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#FBF9FC}
/* ===== PANELS / CARDS ===== */
.panel{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:20px;margin-bottom:18px}
.panel h2{font-size:16px;margin:0 0 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel h2 .num{background:var(--pink);color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
/* ===== FORMS ===== */
.fld{margin-bottom:14px}.fld.row{display:flex;gap:12px}.fld.row>div{flex:1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--ink)}
label .opt{color:var(--muted);font-weight:500}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink-lt);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:60px}
.toggle-group{display:flex;gap:8px}
.toggle-opt{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;background:var(--paper);transition:.12s}
.toggle-opt .ic{font-size:18px;display:block;margin-bottom:3px}
.toggle-opt.on{border-color:var(--pink);background:#FDF0F6;color:var(--pink)}
.toggle-opt.on.cold{border-color:var(--sky);background:#EDF5FB;color:var(--sky)}
.toggle-opt.on.exp{border-color:var(--exp);background:#FCEEEC;color:var(--exp)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
/* ===== CART DRAWER ===== */
.drawer-bg{position:fixed;inset:0;background:rgba(45,34,53,.4);z-index:90;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:var(--cream);z-index:91;box-shadow:-8px 0 30px rgba(45,34,53,.2);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer .dhead{padding:18px 20px;background:var(--aubergine);color:#fff;display:flex;align-items:center;justify-content:space-between}
.drawer .dhead h3{margin:0;font-size:17px;font-weight:800}
.drawer .dhead .x{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.drawer .dbody{flex:1;overflow:auto;padding:16px 20px}
.drawer .dfoot{padding:16px 20px;border-top:1px solid var(--line);background:var(--paper)}
.lineitem{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lineitem .li-emoji{font-size:24px}
.lineitem .li-name{flex:1;font-size:13px;font-weight:600;line-height:1.3}
.lineitem .li-meta{font-size:11px;color:var(--muted)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .big{font-size:44px;margin-bottom:10px}
/* ===== MISSION CONTROL ===== */
.mc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);padding:15px 17px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.shipment{background:var(--paper);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.shipment .sh-top{padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.shipment .sh-id{font-weight:800;font-size:14px}
.shipment .sh-to{font-size:12.5px;color:var(--muted)}
.shipment .sh-sp{margin-left:auto;font-size:12px;font-weight:700;background:#F3EEF8;color:var(--aubergine);padding:4px 11px;border-radius:20px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge2{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:11px;text-transform:uppercase;letter-spacing:.3px;display:inline-flex;align-items:center;gap:3px}
.b-cold{background:#EDF5FB;color:var(--sky)}.b-ambient{background:#F3ECDD;color:var(--amber)}
.b-air{background:#FCEEEC;color:var(--exp)}.b-ground{background:#EEF3EC;color:var(--mint)}
.b-exp{background:var(--exp);color:#fff}
.status-pill{font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px}
.st-draft{background:#EEE9F2;color:#6B5B7E}
.st-submitted{background:#FDF0F6;color:var(--pink)}
.st-processing{background:#FEF6E7;color:var(--amber)}
.st-shipped{background:#EAF6F0;color:var(--mint)}
.st-delivered{background:#E6F0E9;color:#1E6E45}
.sh-detail{padding:0 18px 16px;border-top:1px solid var(--line);display:none}
.sh-detail.open{display:block}
.sh-detail .row2{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}
.sh-detail .kv{font-size:12.5px}.sh-detail .kv .k{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.sh-items{margin-top:12px;font-size:12.5px}
.sh-items .it{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.pipeline{display:flex;gap:0;margin-top:14px}
.pipeline .step{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--muted);position:relative;padding-top:18px}
.pipeline .step::before{content:'';position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}
.pipeline .step:last-child::before{display:none}
.pipeline .step .dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--line);z-index:2}
.pipeline .step.done{color:var(--mint)}.pipeline .step.done .dot{background:var(--mint)}
.pipeline .step.done::before{background:var(--mint)}
.pipeline .step.current .dot{background:var(--pink);box-shadow:0 0 0 3px #FDF0F6}
.pipeline .step.current{color:var(--pink)}
/* addr book */
.addr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.addr-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative}
.addr-card .anick{font-weight:800;font-size:14px;margin-bottom:5px}
.addr-card .aline{font-size:12.5px;color:var(--muted);line-height:1.5}
.addr-card .aacts{margin-top:11px;display:flex;gap:7px}
/* address table */
.atable{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.atable thead th{text-align:left;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 16px;background:#FBF9FC;border-bottom:1px solid var(--line)}
.atable tbody td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top}
.atable tbody tr:last-child td{border-bottom:0}
.atable tbody tr:hover{background:#FDFAFC}
.atable .t-nick{font-weight:700}
.atable .t-sub{font-size:11.5px;color:var(--muted)}
.atable .t-acts{display:flex;gap:6px;justify-content:flex-end}
.selectable{cursor:pointer}.selectable:hover{border-color:var(--pink)}
.selectable.sel{border-color:var(--pink);box-shadow:0 0 0 2px #FDF0F6}
.modal-bg{position:fixed;inset:0;background:rgba(45,34,53,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:50px}
.modal{background:var(--paper);border-radius:14px;width:520px;max-width:94vw;max-height:85vh;overflow:auto;box-shadow:0 16px 50px rgba(45,34,53,.3)}
.modal .mhead{padding:17px 22px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.modal .mbody{padding:20px 22px}.modal .mfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.collateral-list label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:7px 0;cursor:pointer}
.collateral-list input{width:auto}
.reqframe{background:#FBF6F9;border:1px solid #F0E2EC;border-radius:11px;padding:14px 15px;margin-bottom:16px}
.reqframe .rf-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--pink);margin-bottom:10px}
.quickstart{background:#F6F3FA;border:1px solid #E9E1F2;border-radius:11px;padding:13px 15px;margin-bottom:16px}
.quickstart .qs-title{font-size:12.5px;font-weight:800;color:var(--aubergine);margin-bottom:9px}
.quickstart .qs-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:6px}
.qs-chips{display:flex;flex-wrap:wrap;gap:7px}
.qs-chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--aubergine);cursor:pointer;font-family:inherit}
.qs-chip:hover{border-color:var(--pink);background:#FDF0F6}
.qs-chip.dup{color:var(--sky)}.qs-chip.dup:hover{border-color:var(--sky);background:#EDF5FB}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:#F3EEF8;color:var(--aubergine)}
/* shipstation panel */
.sspanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.ss-head{display:flex;align-items:center;gap:11px;padding:13px 18px;cursor:pointer;background:linear-gradient(90deg,#2D2235,#3E3049)}
.ss-badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#C2185B;color:#fff;padding:4px 11px;border-radius:20px}
.ss-title{color:#fff;font-weight:700;font-size:13.5px}
.ss-chev{margin-left:auto;color:#C9B8D6;font-size:11px}
.ss-body{padding:18px 20px}
.ss-p{font-size:13px;line-height:1.6;margin:0 0 14px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#F3EEF8;color:#5B3A86;padding:1px 6px;border-radius:5px}
.ss-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px}
@media(max-width:820px){.ss-cols{grid-template-columns:1fr}}
.ss-col{background:#FBFAFC;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.ss-ct{font-size:12px;font-weight:800;color:var(--mint);margin-bottom:8px}
.ss-ct.warn{color:var(--amber)}
.ss-col ul{margin:0;padding-left:16px}
.ss-col li{font-size:12px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.ss-foot{font-size:12.5px;line-height:1.6;background:#FDF0F6;border:1px solid #F3D9E6;border-radius:10px;padding:12px 15px;margin:0}
.ss-auto{background:#F6F3FA;border:1px solid #E4DAF0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ss-auto-t{font-size:13px;font-weight:800;color:var(--aubergine);margin-bottom:8px}
.ss-warn-box{background:#FEF6E7;border:1px solid #F5E2B8;border-radius:8px;padding:10px 13px;font-size:12px;line-height:1.55;color:#8A6410}
.ss-ol{margin:0;padding-left:18px}.ss-ol li{font-size:12px;line-height:1.55;margin-bottom:7px}
.ss-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:820px){.ss-split{grid-template-columns:1fr}}
.ss-split-col{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.ss-split-h{font-size:11px;font-weight:800;color:var(--aubergine);margin-bottom:7px;line-height:1.35}
.ss-split-col ul{margin:0;padding-left:15px}.ss-split-col li{font-size:11.5px;line-height:1.5;margin-bottom:6px}
.ss-note{margin-top:11px;background:#EDF5FB;border:1px solid #CFE4F2;border-radius:8px;padding:10px 13px;font-size:11.5px;line-height:1.55;color:#1A5276}
.ss-config{background:#F6F3FA;border:1px solid #E4DAF0;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ss-config-t{font-size:13px;font-weight:800;color:var(--aubergine);margin-bottom:8px}
.ss-cfg-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ss-cfg-item:last-child{margin-bottom:0}

function flavorFamily(c){return c.stuffing?(c.outer+' / '+c.stuffing):(c.outer||c.desc);}
function familyEmoji(c){return EMOJI[c.form]||'🍪';}
function renderShop(){
 const filters=['All','Stuffed','Shot','Gourmet','Classic'];
 let h='<div class="pagehead"><div><h1>Order Samples</h1><div class="sub">Organized by prep state, then tier, then size — the order that drives how a sample shipment is pulled and handled.</div></div></div>';
 h+='<div class="shopbar">'+filters.map(f=>'<button class="chipfilter'+(shopFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join('')+'</div>';
 let items=CATALOG.filter(c=>{
   if(shopFilter==='All')return true;
   if(shopFilter==='Stuffed'||shopFilter==='Shot')return c.form===shopFilter;
   return c.tier===shopFilter;
 });
 if(items.length===0)return h+'<div class="empty-state"><div class="big">🍪</div>No cookies match this filter.</div>';
 // HIERARCHY: Prep State > Tier > Size(row, sorted by size)
 const prepOrder=['Baked','Raw'];
 const tierOrder=['Gourmet','Classic'];
 const preps=prepOrder.filter(p=>items.some(c=>(c.prep||'Baked')===p));
 preps.forEach(prep=>{
   const prepItems=items.filter(c=>(c.prep||'Baked')===prep);
   const prepCls=prep.toLowerCase()==='raw'?'prep-raw':'prep-baked';
   const storage=prep.toLowerCase()==='raw'?'❄️ ships frozen':'🌡 ships ambient';
   h+='<div class="prepband"><div class="pb-head"><span class="pb-badge '+prepCls+'">'+esc(prep)+'</span><span class="pb-count">'+prepItems.length+' cookie'+(prepItems.length>1?'s':'')+' · '+storage+'</span></div>';
   const tiers=tierOrder.filter(t=>prepItems.some(c=>c.tier===t));
   tiers.forEach(tier=>{
     const tierItems=prepItems.filter(c=>c.tier===tier).slice().sort((a,b)=>(parseFloat(a.oz)-parseFloat(b.oz))||flavorFamily(a).localeCompare(flavorFamily(b)));
     const tierCls=tier==='Gourmet'?'tier-gourmet':'tier-classic';
     h+='<div class="tiersect"><div class="ts-head"><span class="attr-pill '+tierCls+'">'+esc(tier)+'</span><span class="ts-name">'+esc(tier)+' cookies</span><span class="ts-count">'+tierItems.length+' option'+(tierItems.length>1?'s':'')+'</span></div>';
     h+='<div class="col-head2"><div>Product</div><div>Size</div><div>UOM</div><div style="text-align:right">Qty</div></div>';
     tierItems.forEach(c=>{
       const inCart=cart.find(x=>x.code===c.code);
       h+='<div class="catrow2"><div><div class="c-variant">'+esc(c.desc)+'</div><div class="c-code">'+esc(c.code)+' · '+esc(c.form)+'</div></div>';
       h+='<div><span class="size-pill">'+esc(c.oz)+'oz</span></div>';
       h+='<div><span class="uom-pill">1 cookie · EA</span></div>';
       h+='<div class="rowactions"><div class="qtybox"><button onclick="bump(\''+c.code+'\',-1)">−</button><input id="q-'+c.code+'" value="'+(inCart?inCart.qty:1)+'" onchange="setQty(\''+c.code+'\',this.value)"><button onclick="bump(\''+c.code+'\',1)">+</button></div>';
       h+='<button class="addbtn'+(inCart?' added':'')+'" onclick="addToCart(\''+c.code+'\')">'+(inCart?'✓ Added':'Add')+'</button></div></div>';
     });
     h+='</div>';
   });
   h+='</div>';
 });
 return h;
}
function nameOf(c){if(c.stuffing)return c.outer+' / '+c.stuffing;return c.outer||c.desc;}
function setFilter(f){shopFilter=f;render();}
function bump(code,d){const inp=document.getElementById('q-'+code);let v=Math.max(1,(parseInt(inp.value)||1)+d);inp.value=v;}
function setQty(code,v){const inCart=cart.find(x=>x.code===code);if(inCart)inCart.qty=Math.max(1,parseInt(v)||1);}
function addToCart(code){
 const c=CATALOG.find(x=>x.code===code);const qty=Math.max(1,parseInt(document.getElementById('q-'+code).value)||1);
 const ex=cart.find(x=>x.code===code);
 if(ex)ex.qty=qty;else cart.push({code:c.code,desc:c.desc,name:nameOf(c),qty,tier:c.tier,form:c.form});
 render();
}

     h+='<button class="btn btn-sm btn-ghost" onclick="rmCustom(\''+ci.id+'\')" style="margin-left:6px">✕</button></div>';

  h+='<li><b>Confirmation emails</b> — ShipStation\'s ShipNotify emails the salesperson with tracking when the label is created.</li>';
  h+='<li><b>Tags</b> — flags like <span class="mono">Refrigerated</span> or <span class="mono">custom-box</span> can be pushed as ShipStation tags to drive the co-man\'s automation rules. (Speed is <i>not</i> a tag — it rides the dedicated <span class="mono">ShippingMethod</span> element.)</li>';
  h+='</ul></div>';
  h+='<div class="ss-col"><div class="ss-ct warn">⚠ Challenges &amp; pitfalls to plan for</div><ul>';
  h+='<li><b>Field mapping is the real work.</b> Our model (salesperson, account, temp state, box spec, collateral, required-by date) doesn\'t map 1:1 to ShipStation\'s order schema. Only some fields have native homes; the rest must ride in <span class="mono">customField1-3</span>, <span class="mono">internalNotes</span>, tags, or advanced options — and the co-man must know where to look.</li>';

  h+='<div class="ss-note"><b>Timing gotcha:</b> rules run when an order <b>imports</b> (enters Awaiting Shipment) — once. Edits to an order already in Awaiting Shipment <b>won\'t</b> re-trigger rules. If a leader changes a shipment after pushing, plan a deliberate re-process or re-push.</div>';

  h+='</div>';
    h+='<p class="ss-foot"><b>PM recommendation:</b> build against a <b>duplicate/sandbox store</b> first (ShipStation\'s own advice), lock the <b>field-mapping contract</b> and SKU list with the co-man before writing code, encode handling as <b>ShipStation product tags + order tags feeding automation rules</b> (never raw-SKU rules, which break on multi-item orders), drive status via <b>webhooks</b> (not polling), and keep keys server-side. Lock the <b>tag vocabulary</b> (<span class="mono">cold-chain</span>, <span class="mono">custom-box</span>…) and the SKU-to-tag map with the co-man before writing code — that mapping <i>is</i> the integration contract. Treat collateral as an explicit decision (packing-slip note field + template token). And capture the two <b>ShipStation-side configs</b> above as setup steps: box mapping via packages + rules, and the BCC of <span class="mono">samplesmngmt@cortinafoods.com</span> on notifications.</p>';

 let list=shipments.filter(s=>mcFilter==='All'||s.salesperson===mcFilter);
 list.forEach(s=>{h+=shipmentCard(s);});
 if(list.length===0)h+='<div class="empty-state"><div class="big">📦</div>No shipments for this filter.</div>';
 return h;
}
let mcFilter='All';
function setMc(f){mcFilter=f;render();}
function shipmentCard(s){
 const stIdx=PIPE.indexOf(s.status);
 let h='<div class="shipment"><div class="sh-top" onclick="toggleShip(\''+s.id+'\')">';
 h+='<div><div class="sh-id">'+esc(s.id)+(s.account?' · <span style="font-weight:600;color:var(--muted)">'+esc(s.account)+'</span>':'')+'</div><div class="sh-to">'+esc(s.addr.nick)+'</div></div>';
 h+='<div class="badges">';
 h+='<span class="status-pill st-'+s.status+'">'+PIPE_LABEL[s.status]+'</span>';
 h+='<span class="badge2 '+(s.temp==='Cold'?'b-cold':'b-ambient')+'">'+(s.temp==='Cold'?'❄️ Cold':'🌡 Ambient')+'</span>';
 h+='<span class="badge2 '+(s.speed==='ground'?'b-ground':'b-air')+'">'+(s.speed==='ground'?'🚚 ':'✈️ ')+esc(speedLabel(s.speed))+'</span>';
 h+='</div>';
 h+='<span class="sh-sp">'+esc(s.salesperson)+'</span></div>';
 // detail
 h+='<div class="sh-detail" id="d-'+s.id+'">';
 h+='<div class="pipeline">'+PIPE.map((p,i)=>'<div class="step '+(i<stIdx?'done':i===stIdx?'current':'')+'"><span class="dot"></span>'+PIPE_LABEL[p]+'</div>').join('')+'</div>';
 h+='<div class="row2"><div class="kv"><div class="k">Ship to</div>'+esc(s.addr.name)+' · '+esc(s.addr.company)+'<br>'+esc(s.addr.street)+', '+esc(s.addr.city)+' '+esc(s.addr.state)+' '+esc(s.addr.zip)+'</div>';
 h+='<div class="kv"><div class="k">Required by</div>'+(s.reqDate?esc(s.reqDate):'—')+(s.speed!=='ground'?' <span class="badge2 b-exp">'+esc(speedLabel(s.speed))+'</span>':'')+'</div>';
 h+='<div class="kv"><div class="k">Box</div>'+esc(s.box)+'</div>';
 h+='<div class="kv"><div class="k">Collateral</div>'+(s.collateral.length?s.collateral.map(c=>'<span class="tag">'+esc(c)+'</span>').join(' '):'—')+'</div></div>';
 h+='<div class="sh-items"><div class="k" style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px">Samples</div>';
 s.items.forEach(it=>{h+='<div class="it"><span>'+(it.custom?'<span class="ci-tag">✦ Custom</span> ':'')+esc(it.desc)+(it.custom&&it.projectNo?' <span class="proj-tag">Project '+esc(it.projectNo)+'</span>':'')+'</span><span style="font-weight:700">×'+it.qty+'</span></div>';});
 h+='</div>';
 if(s.notes)h+='<div style="margin-top:10px;font-size:12.5px"><span class="k" style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">Notes</span><br>'+esc(s.notes)+'</div>';
 // status advance (demo)
 h+='<div style="margin-top:14px;display:flex;gap:8px">';
 if(stIdx<PIPE.length-1)h+='<button class="btn btn-sm btn-primary" onclick="advance(\''+s.id+'\')">Advance to '+PIPE_LABEL[PIPE[stIdx+1]]+' →</button>';
 h+='<button class="btn btn-sm btn-ghost" onclick="alert(\'In the real build, this pushes the order to ShipStation for your co-man to print labels & packing slips and fulfill. Confirmation and status emails go to '+esc(s.salesperson)+'.\')">↗ Send to ShipStation</button>';
 h+='</div></div></div>';
 return h;
}
function toggleShip(id){document.getElementById('d-'+id).classList.toggle('open');}
function advance(id){const s=shipments.find(x=>x.id===id);const i=PIPE.indexOf(s.status);if(i<PIPE.length-1)s.status=PIPE[i+1];render();setTimeout(()=>{const d=document.getElementById('d-'+id);if(d)d.classList.add('open');},0);}

// ===== ADDRESS BOOK =====
function renderAddress(){
 let h='<div class="pagehead"><div><h1>Address Book</h1><div class="sub">Saved ship-to addresses. Reused across shipments so you never re-type a buyer\'s details.</div></div><button class="btn btn-primary" onclick="openAddrModal()">+ Add address</button></div>';
 if(addresses.length===0)return h+'<div class="empty-state"><div class="big">📇</div>No saved addresses yet.</div>';
 h+='<table class="atable"><thead><tr><th>Nickname</th><th>Contact</th><th>Company</th><th>Address</th><th style="text-align:right">Actions</th></tr></thead><tbody>';
 addresses.forEach(a=>{
   h+='<tr><td class="t-nick">'+esc(a.nick)+'</td>';
   h+='<td>'+esc(a.name||'—')+'</td>';
   h+='<td>'+esc(a.company||'—')+'</td>';
   h+='<td>'+esc(a.street)+'<div class="t-sub">'+esc(a.city)+', '+esc(a.state)+' '+esc(a.zip)+'</div></td>';
   h+='<td><div class="t-acts"><button class="btn btn-sm btn-ghost" onclick="openAddrModal(\''+a.id+'\')">Edit</button><button class="btn btn-sm btn-ghost" onclick="delAddr(\''+a.id+'\')">Delete</button></div></td></tr>';
 });
 h+='</tbody></table>';
 return h;
}
let editAddrId=null;
let addrFromCheckout=false;
function openAddrModal(id,fromCheckout){
 editAddrId=id||null;addrFromCheckout=!!fromCheckout;const a=id?addresses.find(x=>x.id===id):{nick:'',name:'',company:'',street:'',city:'',state:'',zip:''};
 let h='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mhead">'+(id?'Edit address':'Add address')+'</div><div class="mbody">';
 h+='<div class="fld"><label>Nickname</label><input id="a-nick" value="'+esc(a.nick)+'" placeholder="e.g. Whole Foods HQ — Austin"></div>';
 h+='<div class="fld row"><div><label>Contact name</label><input id="a-name" value="'+esc(a.name)+'"></div><div><label>Company</label><input id="a-company" value="'+esc(a.company)+'"></div></div>';
 h+='<div class="fld"><label>Street</label><input id="a-street" value="'+esc(a.street)+'"></div>';
 h+='<div class="fld row"><div><label>City</label><input id="a-city" value="'+esc(a.city)+'"></div><div style="max-width:80px"><label>State</label><input id="a-state" value="'+esc(a.state)+'"></div><div style="max-width:110px"><label>ZIP</label><input id="a-zip" value="'+esc(a.zip)+'"></div></div>';
 h+='</div><div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAddr()">'+(id?'Save':'Add address')+'</button></div></div></div>';
 document.getElementById('modalMount').innerHTML=h;
}
function closeModal(){document.getElementById('modalMount').innerHTML='';}
function saveAddr(){
 const g=id=>document.getElementById(id).value.trim();
 const data={nick:g('a-nick'),name:g('a-name'),company:g('a-company'),street:g('a-street'),city:g('a-city'),state:g('a-state'),zip:g('a-zip')};
 if(!data.nick){alert('Give the address a nickname.');return;}
 let newId;
 if(editAddrId){Object.assign(addresses.find(a=>a.id===editAddrId),data);newId=editAddrId;}
 else{newId='A'+(addresses.length+1)+Date.now()%1000;addresses.push({id:newId,...data});}
 closeModal();
 if(addrFromCheckout){ship.addrId=newId;addrFromCheckout=false;renderCart();}
 else render();
}
function delAddr(id){if(confirm('Delete this address?')){addresses=addresses.filter(a=>a.id!==id);render();}}

render();
</script></body></html>
